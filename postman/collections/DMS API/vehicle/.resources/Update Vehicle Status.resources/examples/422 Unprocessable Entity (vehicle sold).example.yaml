$kind: http-example
request:
  url: "{{base_url}}/api/v1/vehicle/1/status"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    Content-Type: application/json
    X-Platform: web
    X-Device-Id: device-001
  body:
    type: text
    content: |-
      {
        "status": "ready_for_sale"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity
  body:
    type: text
    content: |-
      {
        "success": false,
        "error": {
          "code": "VEHICLE_UPDATE_FORBIDDEN",
          "message": "vehicle is sold"
        }
      }
order: 3
