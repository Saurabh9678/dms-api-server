$kind: http-example
request:
  url: "{{base_url}}/api/v1/vehicle/1/image"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    X-Platform: web
    X-Device-Id: device-001
response:
  statusCode: 400
  statusText: Bad Request
  body:
    type: text
    content: |-
      {
        "success": false,
        "error": {
          "code": "FILE_TOO_LARGE",
          "message": "invalid request"
        }
      }
order: 2500
