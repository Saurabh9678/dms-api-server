$kind: http-example
request:
  url: "{{base_url}}/api/v1/vehicle/1/image"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    X-Platform: web
    X-Device-Id: device-001
response:
  statusCode: 404
  statusText: Not Found
  body:
    type: text
    content: |-
      {
        "success": false,
        "error": {
          "code": "VEHICLE_NOT_FOUND",
          "message": "vehicle not found"
        }
      }
order: 3000
