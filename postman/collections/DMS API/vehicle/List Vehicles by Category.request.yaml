$kind: http-request
description: List vehicles in a showroom grouped by category (cars, bikes, scooties). Requires showroom_id; caller must be a member of that showroom. Defaults to all statuses. Supports filtering by status, type, and price range with pagination (page/limit). Each vehicle includes an images map (label → [{id,url}] signed URLs; empty object when none).
url: "{{base_url}}/api/v1/vehicle/listing?showroom_id=1&page=1&limit=20"
method: GET
headers:
  X-Platform: web
  X-Device-Id: device-001
  Authorization: Bearer {{access_token}}
examples: ./.resources/List Vehicles by Category.resources/examples
order: 2000
