$kind: http-example
request:
  url: "{{base_url}}/api/v1/user/me"
  method: GET
  headers:
    Authorization: Bearer {{access_token}}
    X-Platform: web
    X-Device-Id: browser-1
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "profile fetched",
        "data": {
          "name": "John Doe",
          "country_code": "+91",
          "phone_number": "9999999999",
          "showroom_roles": [
            {"showroom_id": 1, "external_showroom_id": "SHOP0001", "showroom_name": "Showroom A", "role": "owner"},
            {"showroom_id": 2, "external_showroom_id": "SHOP0002", "showroom_name": "Showroom B", "role": "manager"}
          ],
          "required_name": false,
          "has_showrooms": true,
          "has_vehicles": true
        }
      }
order: 1000
