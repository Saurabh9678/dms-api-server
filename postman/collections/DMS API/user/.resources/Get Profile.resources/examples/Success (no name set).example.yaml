$kind: http-example
request:
  url: "{{base_url}}/api/v1/user/me"
  method: GET
  headers:
    Authorization: Bearer {{access_token}}
    X-Platform: web
    X-Device-Id: browser-1
response:
  statusCode: 200
  statusText: OK
  body:
    type: text
    content: |-
      {
        "success": true,
        "message": "profile fetched",
        "data": {
          "name": null,
          "country_code": "+91",
          "phone_number": "9999999999",
          "showroom_roles": [],
          "required_name": true,
          "has_showrooms": false,
          "has_vehicles": false
        }
      }
order: 2000
