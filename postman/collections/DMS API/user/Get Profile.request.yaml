$kind: http-request
description: "User: Protected endpoint (requires Bearer token). Returns the authenticated user's profile including name, separate country code and local phone number, showroom-role pairs with numeric and external showroom identifiers, and onboarding flags. Fields are nullable where documented."
url: "{{base_url}}/api/v1/user/me"
method: GET
headers:
  Authorization: Bearer {{access_token}}
  X-Platform: web
  X-Device-Id: browser-1
examples: ./.resources/Get Profile.resources/examples
order: 2000
