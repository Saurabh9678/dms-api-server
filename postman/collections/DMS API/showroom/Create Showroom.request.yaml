$kind: http-request
description: "Protected. Creates a showroom, assigns the authenticated user as owner, and returns both the numeric id and generated 8-character showroom_id."
url: "{{base_url}}/api/v1/showroom"
method: POST
headers:
  Authorization: Bearer {{access_token}}
  X-Platform: web
  X-Device-Id: browser-1
body:
  type: text
  content: |-
    name=My Showroom
    geolocation={"address":"123 Main St","city":"Bengaluru","state":"Karnataka","pincode":"560001","lat":12.9716,"lng":77.5946}
examples: ./.resources/Create Showroom.resources/examples
order: 1000
