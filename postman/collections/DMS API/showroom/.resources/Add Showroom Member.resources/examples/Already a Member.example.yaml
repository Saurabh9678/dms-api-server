$kind: http-example
request:
  url: "{{base_url}}/api/v1/showroom/1/member"
  method: POST
  headers:
    Authorization: Bearer {{access_token}}
    Content-Type: application/json
    X-Platform: web
    X-Device-Id: browser-1
  body:
    type: text
    content: |-
      {
        "name": "Jane Doe",
        "country_code": "91",
        "phone_number": "9876543210",
        "role": "employee"
      }
response:
  statusCode: 409
  statusText: Conflict
  body:
    type: text
    content: |-
      {
        "success": false,
        "error": {
          "code": "ALREADY_A_MEMBER",
          "message": "invalid request"
        }
      }
order: 3000
