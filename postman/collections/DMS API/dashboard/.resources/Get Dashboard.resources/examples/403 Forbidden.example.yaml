$kind: http-example
request:
  url: "{{base_url}}/api/v1/dashboard?duration=1m&showroom_id=1"
  method: GET
  headers:
    Authorization: Bearer {{access_token}}
    X-Platform: web
    X-Device-Id: {{device_id}}
response:
  statusCode: 403
  statusText: Forbidden
  body:
    type: text
    content: |-
      {
        "success": false,
        "message": "forbidden",
        "error": {
          "code": "FORBIDDEN"
        }
      }
order: 4000
