$kind: http-request
description: "Protected. Owner/manager only. Returns dealership health overview for a showroom: sales, inventory, expenses, top vehicle types. Optional showroom_id (defaults to caller's lowest owner/manager showroom). Duration filters sales and expenses; inventory is current showroom state."
url: "{{base_url}}/api/v1/dashboard?duration=1m&showroom_id=1"
method: GET
headers:
  Authorization: Bearer {{access_token}}
  X-Platform: web
  X-Device-Id: {{device_id}}
examples: ./.resources/Get Dashboard.resources/examples
order: 1000
